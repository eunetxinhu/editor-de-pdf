<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de PDF</title>
    <meta name="description" content="Ferramentas de PDF que rodam no seu navegador: juntar, dividir, comprimir, converter, assinar, proteger e mais. Seus arquivos não saem do seu computador.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M6 2h14l6 6v22H6z' fill='%232546C7'/%3E%3Cpath d='M20 2v6h6' fill='%2390A4EE'/%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Caveat:wght@600&family=Dancing+Script:wght@600&family=Homemade+Apple&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/app.css">

    <script>
        // Aplica o tema salvo antes de pintar a página (evita "piscar")
        try {
            const t = localStorage.getItem('tema');
            if (t) document.documentElement.dataset.theme = t;
        } catch (e) {}
    </script>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a href="#/" class="brand" aria-label="Início">
                <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 2h14l6 6v22H6z"/><path class="fold" d="M20 2v6h6"/></svg>
                <span>Editor de PDF</span>
            </a>
            <div class="topbar-actions">
                <span class="privacy-pill" title="Todo o processamento acontece no seu navegador">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5z"/></svg>
                    Arquivos ficam no seu computador
                </span>
                <button class="icon-btn" id="theme-toggle" type="button" aria-label="Alternar tema claro/escuro" title="Alternar tema">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                </button>
            </div>
        </div>
    </header>

    <main id="app" tabindex="-1"></main>

    <footer class="footer">
        <p>Feito por <a href="https://github.com/eunetxinhu" target="_blank" rel="noopener">Neto</a>. Nenhum arquivo é enviado para servidor: tudo é processado no seu navegador.</p>
    </footer>

    <div id="toasts" class="toasts" aria-live="polite"></div>
    <div id="modal-root"></div>

    <!-- Bibliotecas principais (as demais carregam só quando a ferramenta precisa) -->
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>

    <script src="assets/js/core.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/editor.js"></script>
    <script src="assets/js/tools/organizar.js"></script>
    <script src="assets/js/tools/otimizar.js"></script>
    <script src="assets/js/tools/converter.js"></script>
    <script src="assets/js/tools/editar.js"></script>
    <script src="assets/js/tools/seguranca.js"></script>
    <script src="assets/js/tools/extras.js"></script>
    <script>App.start();</script>
</body>
</html>
